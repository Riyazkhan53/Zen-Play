# Builds an installable Android APK on every push to main (or on demand) and
# publishes it as the "android-latest" release, so it can be downloaded
# straight onto a phone. No Expo account needed.
#
# Set the repository variable SERVER_URL (Settings → Secrets and variables →
# Actions → Variables) to your online server, e.g. wss://zen-play-server.onrender.com
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  # Queue new builds rather than cancelling one that's nearly done.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL || 'wss://zen-play-server.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # The default Expo template signs release builds with the debug key:
        # fine for installing on your own phones, not for the Play Store.
        # arm64 only: what virtually every Android phone from the last several years
        # uses. Keeps the APK small and the build quick.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/zen-play.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zen-play-apk
          path: out/zen-play.apk

      - name: Publish as the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/zen-play.apk \
            --title "Zen-Play Android (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Online server: ${EXPO_PUBLIC_SERVER_URL}. Open this page on your phone and tap zen-play.apk to install." \
            --prerelease --target "$GITHUB_SHA"
